            display: flex;
            justify-content: center;

            padding: 20px;

        .container {
            background: white;

        .logo {

            justify-content: center;

        /* 激活码页面 */

        }

            outline: none;
            transition: border-color 0.3s ease;
            letter-spacing: 3px;
        }

        .activation-input:focus {
            border-color: #ff6b9d;
        }

        .activation-input::placeholder {
            letter-spacing: normal;
            color: #ccc;
        }

        /* 欢迎页面 */
        .welcome-page {
            text-align: center;
        }

        .welcome-text {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
            margin: 20px 0;
        }

        .feature-list {
            text-align: left;
            margin: 20px 0;
            padding: 20px;
            background: #fff5f8;
            border-radius: 12px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            color: #666;
            font-size: 14px;
        }

        .feature-item::before {
            content: '✨';
            margin-right: 10px;
        }

        /* 进度条 */
        .progress-container {
            margin-bottom: 20px;
        }

        .progress-text {
            text-align: center;
            color: #ff6b9d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ffe0e8;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #ffa573);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* 问题容器 */
        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid #ffe0e8;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            color: #555;
        }

        .option:hover {
            border-color: #ff6b9d;
            background: #fff5f8;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: #ff6b9d;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa573 100%);
            color: white;
        }

        .option-radio {
            width: 20px;
            height: 20px;
            border: 2px solid #ff6b9d;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .option.selected .option-radio {
            border-color: white;
            background: white;
        }

        .option.selected .option-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #ff6b9d;
            border-radius: 50%;
        }

        /* 按钮 */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa573 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            box-shadow: none;

        /* 结果页面 */

        /* 页面切换 */

            text-decoration: none;

        const cities = {
            chengdu: {

                desc: "你是一个懂得享受生活的人！成都的慢节奏和悠闲氛围与你完美匹配。在这里，你可以喝着茶、打着麻将，享受巴适得板的生活。火锅的香辣和熊猫的可爱，都是你的最爱！",

                desc: "你向往自由与诗意！大理的苍山洱海和慢生活让你心驰神往。在这里，你可以远离喧嚣，找到内心的宁静！",
                tags: ["自由", "诗意", "宁静", "慢生活"]
            },
            suzhou: {
                name: "苏州",
                emoji: "🏮",
                image: "🏯",
                desc: "你温婉内敛！苏州的园林和小桥流水正是你的风格。这里的精致、优雅和文化底蕴，让你感受到江南的魅力！",
                tags: ["温婉", "精致", "园林", "优雅"]
            },
            guilin: {
                name: "桂林",
                emoji: "🏞️",
                image: "⛰️",
                desc: "你热爱自然！桂林的山水甲天下让你心驰神往。这里的自然风光和宁静氛围，是你理想的避世之所！",
                tags: ["自然", "山水", "宁静", "美景"]
            }
        };

        let currentQuestion = 0;
        let answers = [];

        // 验证激活码
        function verifyActivation() {
            const code = document.getElementById('activation-code').value.trim();
            if (code === VALID_CODE) {
                switchPage('page-welcome');
            } else {
                alert('激活码错误，请重新输入');
                document.getElementById('activation-code').value = '';
                document.getElementById('activation-code').focus();
            }
        }

        // 切换页面
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // 开始测试
        function startTest() {
            initQuestions();
            switchPage('page-questions');
        }

        // 初始化问题
        function initQuestions() {
            const questionsContainer = document.getElementById('questions');
            questionsContainer.innerHTML = '';

            questions.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = `question-container ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="question">${index + 1}. ${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-city="${opt.city}" onclick="selectOption(this, ${index})">
                                <div class="option-radio"></div>
                                <span>${opt.text}</span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn" id="btn-${index}" onclick="nextQuestion()" disabled>
                        ${index === questions.length - 1 ? '查看结果' : '下一题'}
                    </button>
                `;
                questionsContainer.appendChild(div);
            });
        }

        // 选择选项
        function selectOption(element, questionIndex) {
            const options = element.parentElement.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            
            answers[questionIndex] = element.dataset.city;
            document.getElementById(`btn-${questionIndex}`).disabled = false;
        }

        // 下一题
        function nextQuestion() {
            const containers = document.querySelectorAll('.question-container');
            containers[currentQuestion].classList.remove('active');
            
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                containers[currentQuestion].classList.add('active');
                updateProgress();
            } else {
                showResult();
            }
        }

        // 更新进度
        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;
            document.getElementById('progress-text').textContent = `第${currentQuestion + 1}/${questions.length}题`;
        }

        // 显示结果
        function showResult() {
            // 计算结果
            const cityCounts = {};
            answers.forEach(city => {
                cityCounts[city] = (cityCounts[city] || 0) + 1;
            });
            
            const resultCity = Object.entries(cityCounts).sort((a, b) => b[1] - a[1])[0][0];
            const cityData = cities[resultCity];
            
            document.getElementById('result-image').textContent = cityData.image;
            document.getElementById('result-city').textContent = cityData.name;
            document.getElementById('result-desc').textContent = cityData.desc;
            
            const tagsContainer = document.getElementById('result-tags');
            tagsContainer.innerHTML = cityData.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
            
            switchPage('page-result');
        }

        // 分享
        function share(platform) {
            const cityData = cities[Object.entries(answers.reduce((acc, city) => {
                acc[city] = (acc[city] || 0) + 1;
                return acc;
            }, {})).sort((a, b) => b[1] - a[1])[0][0]];
            
            const text = `我的天选 CP 城市是${cityData.name}${cityData.emoji}！快来测测你的性格与哪个城市最匹配吧～`;
            
            switch(platform) {
                case 'wechat':
                    // 微信分享需要微信 JS SDK，这里简化处理
                    if (navigator.share) {
                        navigator.share({ title: '城市性格匹配', text: text });
                    } else {
                        alert('复制成功！请打开微信分享给好友');
                    }
                    break;
                case 'weibo':
                    window.open(`https://service.weibo.com/share/share.php?title=${encodeURIComponent(text)}`);
                    break;
                case 'qq':
                    window.open(`https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?title=${encodeURIComponent(text)}`);
                    break;
                case 'more':
                    if (navigator.share) {
                        navigator.share({ title: '城市性格匹配', text: text });
                    } else {
                        alert('复制成功！请选择分享方式');
                    }
                    break;
            }
        }

        // 重新开始
        function restart() {
            currentQuestion = 0;
            answers = [];
            document.getElementById('activation-code').value = '';
            document.getElementById('progress').style.width = '14%';
            document.getElementById('progress-text').textContent = '第 1/7 题';
            switchPage('page-activation');
        }

        // 支持回车提交激活码
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('activation-code').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verifyActivation();
                }
            });
        });
    </script>
</body>
</html>
