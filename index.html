            dali: { name: "大理", emoji: "🏔️", tags: ["自由", "诗意", "宁静", "慢生活"], desc: "你向往自由与诗意！大理的苍山洱海、慢节奏生活和文艺氛围，是你心灵的归宿。在这里，时间变得缓慢，心灵变得宁静，你可以远离喧嚣，听风看云，找回最真实的自己。" },
            suzhou: { name: "苏州", emoji: "🏮", tags: ["温婉", "精致", "园林", "优雅"], desc: "你温婉内敛、品味优雅！苏州的古典园林、小桥流水和文化底蕴，与你细腻的性格天作之合。漫步在平江路的青石板，欣赏园林的精巧设计，感受江南水乡的温婉韵味，这就是你向往的生活。" },
            guilin: { name: "桂林", emoji: "🏞️", tags: ["自然", "山水", "宁静", "美景"], desc: "你热爱自然、心向山水！桂林的甲天下山水、宁静氛围和清新空气，是你理想的避世之所。漓江的倒影、象鼻山的奇观、龙脊梯田的壮美，每一处风景都能让你忘却尘世烦恼，回归内心平静。" }
        };

        function showStep(step) {
            ['step1', 'step2', 'step3', 'step4'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(step).classList.remove('hidden');
        }

        function checkCode() {
            const code = document.getElementById('code').value.trim();
            if (code === VALID_CODE) {
                showStep('step2');
            } else {
                alert('激活码错误，请重新输入');
                document.getElementById('code').value = '';
                document.getElementById('code').focus();
            }
        }

        function startTest() {
            currentQ = 0;
            answers = [];
            showQuestion();
            showStep('step3');
        }

        function showQuestion() {
            const q = questions[currentQ];
            const progress = ((currentQ + 1) / TOTAL_QUESTIONS) * 100;
            document.getElementById('progress').style.width = progress + '%';
            document.getElementById('counter').textContent = (currentQ + 1) + '/' + TOTAL_QUESTIONS;
            
            let html = '<div class="question">' + (currentQ + 1) + '. ' + q.q + '</div>';
            q.options.forEach((opt, i) => {
                html += '<div class="option" onclick="selectOption(this,\'' + opt.city + '\')">' +
                    '<div class="radio"></div>' +
                    '<span>' + opt.text + '</span>' +
                    '</div>';
            });
            html += '<button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>' + 
                (currentQ === TOTAL_QUESTIONS - 1 ? '查看结果' : '下一题') + '</button>';
            
            document.getElementById('question-box').innerHTML = html;
        }

        function selectOption(el, city) {
            const options = el.parentElement.querySelectorAll('.option');
            options.forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers[currentQ] = city;
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < TOTAL_QUESTIONS) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const counts = {};
            answers.forEach(city => { counts[city] = (counts[city] || 0) + 1; });
            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            const resultCity = sorted[0][0];
            const topCount = sorted[0][1];
            const matchPercent = Math.round((topCount / TOTAL_QUESTIONS) * 100);
            
            const city = cities[resultCity];
            
            document.getElementById('result-emoji').textContent = city.emoji;
            document.getElementById('result-city').textContent = city.name;
            document.getElementById('match-percent').textContent = matchPercent;
            document.getElementById('result-desc').textContent = city.desc;
            document.getElementById('result-tags').innerHTML = city.tags.map(t => '<span class="result-tag">' + t + '</span>').join('');
            
            showStep('step4');
        }

        function share(platform) {
            const city = cities[Object.entries(answers.reduce((acc, city) => {
                acc[city] = (acc[city] || 0) + 1;
                return acc;
            }, {})).sort((a, b) => b[1] - a[1])[0][0]];
            const text = '我的天选 CP 城市是' + city.name + city.emoji + '！匹配度 ' + document.getElementById('match-percent').textContent + '%，快来测测你的性格与哪个城市最匹配吧～';
            
            if (platform === 'wechat') {
                if (navigator.share) navigator.share({ title: '城市性格匹配', text: text });
                else alert('复制成功！请打开微信分享给好友');
            } else if (platform === 'weibo') {
                window.open('https://service.weibo.com/share/share.php?title=' + encodeURIComponent(text));
            } else if (platform === 'qq') {
                window.open('https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?title=' + encodeURIComponent(text));
            } else {
                if (navigator.share) navigator.share({ title: '城市性格匹配', text: text });
                else alert('复制成功！请选择分享方式');
            }
        }

        function restart() {
            document.getElementById('code').value = '';
            showStep('step1');
        }

        document.getElementById('code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
