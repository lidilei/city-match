        function showStep(step) {
            ['step1', 'step2', 'step3', 'step4'].forEach(s => {
                const el = document.getElementById(s);
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(step);
            if (target) target.classList.remove('hidden');
        }

        function startTest() {
            currentQ = 0;
            answers = [];
            showQuestion();
            showStep('step2');
        }

        function showQuestion() {
            const q = questions[currentQ];
            const progress = ((currentQ + 1) / TOTAL_QUESTIONS) * 100;
            document.getElementById('progress').style.width = progress + '%';
            document.getElementById('counter').textContent = (currentQ + 1) + '/' + TOTAL_QUESTIONS;
            
            let html = '<div class="question">' + (currentQ + 1) + '. ' + q.q + '</div>';
            q.options.forEach((opt, i) => {
                html += '<div class="option" onclick="selectOption(this,' + opt.val + ',\'' + q.dim + '\')">' +
                    '<div class="radio"></div>' +
                    '<span>' + opt.text + '</span>' +
                    '</div>';
            });
            html += '<button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>' + 
                (currentQ === TOTAL_QUESTIONS - 1 ? '查看结果' : '下一题') + '</button>';
            
            document.getElementById('question-box').innerHTML = html;
        }

        function selectOption(el, val, dim) {
            const options = el.parentElement.querySelectorAll('.option');
            options.forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers[currentQ] = { val: val, dim: dim };
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < TOTAL_QUESTIONS) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const dimScores = { slow: 0, fast: 0, culture: 0, food: 0, nature: 0, tech: 0 };
            answers.forEach(a => {
                if (a && a.dim) dimScores[a.dim] += a.val;
            });

            const sortedDims = Object.entries(dimScores).sort((a, b) => b[1] - a[1]);
            const topDim = sortedDims[0][0];
            const topScore = sortedDims[0][1];
            const maxPossible = (TOTAL_QUESTIONS / 6) * 3;

            const candidateCities = DIMENSIONS[topDim];
            const resultCity = candidateCities[Math.floor(Math.random() * candidateCities.length)];
            const city = cities[resultCity];

            const dimRatio = topScore / maxPossible;
            const matchPercent = Math.round(90 + dimRatio * 10);

            document.getElementById('result-emoji').textContent = city.emoji;
            document.getElementById('result-city').textContent = city.name;
            document.getElementById('match-percent').textContent = matchPercent + '%';
            document.getElementById('result-desc').textContent = city.desc;
            document.getElementById('result-tags').innerHTML = city.tags.map(t => '<span class="result-tag">' + t + '</span>').join('');
            
            showStep('step3');
        }

        function restart() {
            showStep('step1');
        }

        document.getElementById('code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkCode();
        });
