<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的性格与哪个城市是天选 CP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa573 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ff6b9d;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa573 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .activation-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #ffe0e8;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            margin: 20px 0;
            outline: none;
            transition: border-color 0.3s ease;
            letter-spacing: 3px;
        }

        .activation-input:focus {
            border-color: #ff6b9d;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa573 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ffe0e8;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #ffa573);
            transition: width 0.3s ease;
        }

        .question {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid #ffe0e8;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: #ff6b9d;
            background: #fff5f8;
        }

        .option.selected {
            border-color: #ff6b9d;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa573 100%);
            color: white;
        }

        .radio {
            width: 20px;
            height: 20px;
            border: 2px solid #ff6b9d;
            border-radius: 50%;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .option.selected .radio {
            background: white;
            border-color: white;
        }

        .result-city {
            font-size: 28px;
            font-weight: bold;
            color: #ff6b9d;
            text-align: center;
            margin: 20px 0;
        }

        .result-desc {
            background: #fff5f8;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            line-height: 1.8;
            color: #666;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }

        .tag {
            padding: 6px 14px;
            background: #fff5f8;
            color: #ff6b9d;
            border-radius: 20px;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Step 1: Activation -->
        <div id="step1">
            <div class="logo">🌆</div>
            <div class="header">
                <h1>城市性格匹配测试</h1>
                <p>请输入激活码开始测试</p>
            </div>
            <input type="text" class="activation-input" id="code" placeholder="请输入激活码" maxlength="8" value="">
            <button class="btn" onclick="checkCode()">开始测试</button>
        </div>

        <!-- Step 2: Welcome -->
        <div id="step2" class="hidden">
            <div class="logo">💕</div>
            <div class="header">
                <h1>你的性格与哪个城市是天选 CP</h1>
            </div>
            <button class="btn" onclick="startTest()">开始测试</button>
        </div>

        <!-- Step 3: Questions -->
        <div id="step3" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progress" style="width: 14%"></div>
            </div>
            <div id="question-box"></div>
        </div>

        <!-- Step 4: Result -->
        <div id="step4" class="hidden">
            <div class="logo" id="result-emoji">🏙️</div>
            <div class="header">
                <h1>测试完成！</h1>
                <p>你的天选 CP 城市是</p>
            </div>
            <div class="result-city" id="result-city"></div>
            <div class="tags" id="result-tags"></div>
            <div class="result-desc" id="result-desc"></div>
            <button class="btn" onclick="restart()">再测一次</button>
        </div>
    </div>

    <script>
        const VALID_CODE = '7k9G2sP5';
        let currentQ = 0;
        let answers = [];

        const questions = [
            {
                q: "周末你更喜欢怎么度过？",
                options: [
                    { text: "宅在家里看书/追剧", city: "chengdu" },
                    { text: "约朋友聚餐逛街", city: "shanghai" },
                    { text: "户外运动爬山", city: "kunming" },
                    { text: "看展览/参加文化活动", city: "beijing" }
                ]
            },
            {
                q: "你理想的生活节奏是？",
                options: [
                    { text: "慢悠悠，享受当下", city: "chengdu" },
                    { text: "快节奏，充满机遇", city: "shenzhen" },
                    { text: "适中，劳逸结合", city: "hangzhou" },
                    { text: "随性自由，不被束缚", city: "dali" }
                ]
            },
            {
                q: "你最喜欢的美食类型？",
                options: [
                    { text: "火锅/麻辣口味", city: "chongqing" },
                    { text: "精致本帮菜/西餐", city: "shanghai" },
                    { text: "小吃/街头美食", city: "changsha" },
                    { text: "清淡/健康饮食", city: "guangzhou" }
                ]
            },
            {
                q: "你对气候的偏好？",
                options: [
                    { text: "四季分明", city: "beijing" },
                    { text: "温暖如春", city: "kunming" },
                    { text: "湿润多雨", city: "hangzhou" },
                    { text: "炎热夏天也无所谓", city: "chongqing" }
                ]
            },
            {
                q: "你更看重城市的什么特质？",
                options: [
                    { text: "历史文化底蕴", city: "beijing" },
                    { text: "经济发展机会", city: "shenzhen" },
                    { text: "生活舒适度", city: "chengdu" },
                    { text: "自然风光", city: "guilin" }
                ]
            },
            {
                q: "你的社交风格？",
                options: [
                    { text: "社牛，喜欢热闹", city: "changsha" },
                    { text: "社恐，喜欢安静", city: "suzhou" },
                    { text: "适中，有几个好友就好", city: "hangzhou" },
                    { text: "随和，都能适应", city: "chengdu" }
                ]
            },
            {
                q: "你对夜生活的态度？",
                options: [
                    { text: "越丰富越好", city: "changsha" },
                    { text: "偶尔出去放松", city: "shanghai" },
                    { text: "不太需要", city: "chengdu" },
                    { text: "喜欢安静的夜晚", city: "dali" }
                ]
            }
        ];

        const cities = {
            chengdu: { name: "成都 🐼", emoji: "🐼", desc: "你懂得享受生活！成都的慢节奏和悠闲氛围与你完美匹配。火锅、熊猫、茶馆，这就是你的理想生活！", tags: ["悠闲", "美食", "舒适"] },
            shanghai: { name: "上海 ✨", emoji: "✨", desc: "你追求精致与品质！上海的国际化氛围和精致生活正是你想要的。外滩、武康路、展览演出，充满格调！", tags: ["精致", "国际", "时尚"] },
            beijing: { name: "北京 🏛️", emoji: "🏛️", desc: "你有深厚的文化底蕴！故宫红墙、胡同烟火、博物馆演出，满足你对知识的渴望！", tags: ["文化", "历史", "大气"] },
            shenzhen: { name: "深圳 🚀", emoji: "🚀", desc: "你是奋斗者！深圳的创新精神和快节奏与你契合，科技感和现代化让你充满活力！", tags: ["创新", "奋斗", "科技"] },
            hangzhou: { name: "杭州 🌸", emoji: "🌸", desc: "你追求诗意与品质的平衡！西湖美景和互联网活力完美结合，江南温婉又有现代便捷！", tags: ["诗意", "平衡", "温婉"] },
            chongqing: { name: "重庆 🌶️", emoji: "🌶️", desc: "你热情似火！麻辣火锅和山城特色正是你的菜，直爽热情和烟火气让你感受生活真谛！", tags: ["热情", "直爽", "麻辣"] },
            kunming: { name: "昆明 🌺", emoji: "🌺", desc: "你向往自然与宁静！四季如春，每天都是春天，生活充满阳光和鲜花！", tags: ["自然", "温暖", "宁静"] },
            changsha: { name: "长沙 🔥", emoji: "🔥", desc: "你活力四射！夜生活和美食文化让你欲罢不能，热闹活力美食让每天充满激情！", tags: ["活力", "夜生活", "美食"] },
            guangzhou: { name: "广州 🥟", emoji: "🥟", desc: "你务实又懂生活！早茶文化和包容氛围让你舒适，美食商业务实精神正是你追求的！", tags: ["务实", "美食", "包容"] },
            dali: { name: "大理 🏔️", emoji: "🏔️", desc: "你向往自由与诗意！苍山洱海和慢生活让你心驰神往，远离喧嚣找到内心宁静！", tags: ["自由", "诗意", "宁静"] },
            suzhou: { name: "苏州 🏮", emoji: "🏮", desc: "你温婉内敛！园林和小桥流水正是你的风格，精致优雅文化底蕴让你感受江南魅力！", tags: ["温婉", "精致", "园林"] },
            guilin: { name: "桂林 🏞️", emoji: "🏞️", desc: "你热爱自然！山水甲天下让你心驰神往，自然风光和宁静氛围是你理想的避世之所！", tags: ["自然", "山水", "美景"] }
        };

        function showStep(step) {
            ['step1', 'step2', 'step3', 'step4'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(step).classList.remove('hidden');
        }

        function checkCode() {
            const code = document.getElementById('code').value.trim();
            if (code === VALID_CODE) {
                showStep('step2');
            } else {
                alert('激活码错误，请重新输入');
                document.getElementById('code').value = '';
                document.getElementById('code').focus();
            }
        }

        function startTest() {
            currentQ = 0;
            answers = [];
            showQuestion();
            showStep('step3');
        }

        function showQuestion() {
            const q = questions[currentQ];
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
            
            let html = '<div class="question">' + (currentQ + 1) + '. ' + q.q + '</div>';
            q.options.forEach((opt, i) => {
                html += '<div class="option" onclick="selectOption(this,\'' + opt.city + '\')">' +
                    '<div class="radio"></div>' +
                    '<span>' + opt.text + '</span>' +
                    '</div>';
            });
            html += '<button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>' + 
                (currentQ === questions.length - 1 ? '查看结果' : '下一题') + '</button>';
            
            document.getElementById('question-box').innerHTML = html;
        }

        function selectOption(el, city) {
            const options = el.parentElement.querySelectorAll('.option');
            options.forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers[currentQ] = city;
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const counts = {};
            answers.forEach(city => { counts[city] = (counts[city] || 0) + 1; });
            const resultCity = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
            const city = cities[resultCity];
            
            document.getElementById('result-emoji').textContent = city.emoji;
            document.getElementById('result-city').textContent = city.name;
            document.getElementById('result-desc').textContent = city.desc;
            document.getElementById('result-tags').innerHTML = city.tags.map(t => '<span class="tag">' + t + '</span>').join('');
            
            showStep('step4');
        }

        function restart() {
            document.getElementById('code').value = '';
            showStep('step1');
        }

        // Enter key support
        document.getElementById('code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
